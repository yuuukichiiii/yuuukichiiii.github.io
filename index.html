<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="BXzW4nJTUB1hc1gujuPGw36wbvyoGaG2o7TBW1ml2qM" />
  <title>yuuukichiiii - Projects</title>
  <style>
    :root { --blue: #1a73e8; --ink: #202124; --muted: #5f6368; --line: #e8eaed; }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); background: #fff; line-height: 1.7;
      font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 56px 20px 80px; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 40px; }
    h2 { font-size: 18px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .card { display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px;
      color: inherit; text-decoration: none; margin-bottom: 12px; }
    .card:hover { border-color: var(--blue); }
    .card strong { color: var(--blue); font-size: 16px; }
    .card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    a { color: var(--blue); }
    footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>yuuukichiiii</h1>
    <p class="sub">Small tools for everyday work.</p>

    <h2>Projects</h2>
    <a class="card" href="https://yuuukichiiii.github.io/drive-path-copier/">
      <strong>Drive Path Copier</strong>
      <p>Chrome extension that copies the Windows Explorer path of the open Google Drive folder.</p>
    </a>

    <footer>
      Contact: <a href="mailto:tanaka.yuki.dev@gmail.com">tanaka.yuki.dev@gmail.com</a> ·
      <a href="https://github.com/yuuukichiiii">GitHub</a>
    </footer>
  </div>
</body>
</html>
